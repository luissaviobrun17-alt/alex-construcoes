<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 115" width="100%" height="100%">
  <defs>
    <!-- Gradientes de Alta Fidelidade Técnica -->
    <linearGradient id="beamSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="beamOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="50%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <linearGradient id="beamBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="60%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <filter id="shadowA" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- SÍMBOLO ESTRUTURAL (PÓRTICO 'A' + 2 PILARES 'Y' PERFEITAMENTE PROPORCIONADOS) -->
  <g transform="translate(12, 6)" filter="url(#shadowA)">
    <!-- Base de Concreto Armado (Radier / Sapata corrida) -->
    <rect x="4" y="93" width="94" height="7" rx="2" fill="#64748B" />
    <rect x="0" y="98" width="102" height="4" rx="2" fill="#94A3B8" />

    <!-- Treliça Superior do 'A' (Reforço Interno em X) -->
    <line x1="51" y1="18" x2="33" y2="52" stroke="#64748B" stroke-width="2" stroke-linecap="round" />
    <line x1="51" y1="18" x2="69" y2="52" stroke="#64748B" stroke-width="2" stroke-linecap="round" />

    <!-- Pernas do Pórtico Principal 'A' (Perfil de Aço Escuro com Contorno Nítido) -->
    <!-- Perna Esquerda -->
    <polygon points="51,10 39,10 6,93 20,93" fill="url(#beamSteel)" stroke="#94A3B8" stroke-width="1.3" />
    <!-- Perna Direita -->
    <polygon points="51,10 63,10 96,93 82,93" fill="url(#beamSteel)" stroke="#94A3B8" stroke-width="1.3" />

    <!-- Topo do Pórtico (Capitel de Amarração em Laranja Segurança) -->
    <polygon points="51,2 64,9 51,16 38,9" fill="url(#beamOrange)" stroke="#FDBA74" stroke-width="0.8" />

    <!-- Viga Mestra Transversal do 'A' (Azul Aço com Reforço) -->
    <rect x="20" y="52" width="62" height="9" rx="2" fill="url(#beamBlue)" stroke="#93C5FD" stroke-width="1" />
    <!-- Rebites/Parafusos da Viga -->
    <circle cx="24" cy="56.5" r="1.5" fill="#FFFFFF" opacity="0.8" />
    <circle cx="78" cy="56.5" r="1.5" fill="#FFFFFF" opacity="0.8" />

    <!-- ================================================================= -->
    <!-- PILARES EM 'Y' (ALUSÃO FAMILIAR: SUSTENTAÇÃO ROBUSTA E INCONFUNDÍVEL) -->
    <!-- Fuste vertical longo (60% da altura) + braços inclinados superiores -->
    <!-- ================================================================= -->

    <!-- PILAR 'Y' ESQUERDO (Filho 1) -->
    <g>
      <!-- Base de ancoragem metálica (sapata do Y) -->
      <rect x="30" y="90" width="14" height="3" rx="1" fill="#EA580C" />
      
      <!-- Tronco/Fuste Vertical do Y (Longo e Sólido: de y=90 subindo até y=71) -->
      <rect x="34.5" y="71" width="5" height="20" rx="1" fill="url(#beamOrange)" stroke="#FDBA74" stroke-width="0.7" />
      
      <!-- Nó Estrutural de Derivação (cálice do Y) -->
      <circle cx="37" cy="71" r="3.5" fill="#1E293B" stroke="#EA580C" stroke-width="2" />

      <!-- Braço Esquerdo do Y (sobe para y=61 apoiando a viga) -->
      <polygon points="35.5,71 38.5,71 29,61 25,61" fill="url(#beamOrange)" stroke="#FDBA74" stroke-width="0.6" />
      <!-- Braço Direito do Y (sobe para y=61 apoiando a viga) -->
      <polygon points="35.5,71 38.5,71 49,61 45,61" fill="url(#beamOrange)" stroke="#FDBA74" stroke-width="0.6" />

      <!-- Placas de apoio no encontro com a viga -->
      <rect x="24" y="60" width="7" height="2" rx="0.5" fill="#FED7AA" />
      <rect x="43" y="60" width="7" height="2" rx="0.5" fill="#FED7AA" />
    </g>

    <!-- PILAR 'Y' DIREITO (Filho 2 - Perfeitamente Simétrico) -->
    <g>
      <!-- Base de ancoragem metálica (sapata do Y) -->
      <rect x="58" y="90" width="14" height="3" rx="1" fill="#EA580C" />
      
      <!-- Tronco/Fuste Vertical do Y (Longo e Sólido: de y=90 subindo até y=71) -->
      <rect x="62.5" y="71" width="5" height="20" rx="1" fill="url(#beamOrange)" stroke="#FDBA74" stroke-width="0.7" />
      
      <!-- Nó Estrutural de Derivação (cálice do Y) -->
      <circle cx="65" cy="71" r="3.5" fill="#1E293B" stroke="#EA580C" stroke-width="2" />

      <!-- Braço Esquerdo do Y (sobe para y=61 apoiando a viga) -->
      <polygon points="63.5,71 66.5,71 57,61 53,61" fill="url(#beamOrange)" stroke="#FDBA74" stroke-width="0.6" />
      <!-- Braço Direito do Y (sobe para y=61 apoiando a viga) -->
      <polygon points="63.5,71 66.5,71 77,61 73,61" fill="url(#beamOrange)" stroke="#FDBA74" stroke-width="0.6" />

      <!-- Placas de apoio no encontro com a viga -->
      <rect x="52" y="60" width="7" height="2" rx="0.5" fill="#FED7AA" />
      <rect x="71" y="60" width="7" height="2" rx="0.5" fill="#FED7AA" />
    </g>
  </g>

  <!-- TIPOGRAFIA: ELEVADA, TOTALMENTE LEGÍVEL E COM ESPAÇO DE SOBRA -->
  <g transform="translate(132, 12)">
    <!-- ALEX (Branco Puro com Drop Shadow para Tema Escuro) -->
    <text x="0" y="46" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="44" fill="#FFFFFF" letter-spacing="2">
      ALEX
    </text>
    <!-- CONSTRUÇÕES (Laranja Canteiro Segurança) -->
    <text x="130" y="46" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="44" fill="#EA580C" letter-spacing="1.5">
      CONSTRUÇÕES
    </text>
    <!-- SUBTÍTULO TÉCNICO -->
    <text x="2" y="74" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="13.5" fill="#38BDF8" letter-spacing="3.2">
      SISTEMA OPERACIONAL DE ENGENHARIA &amp; OBRAS
    </text>
    <!-- LINHA GUIA ESTRUTURAL -->
    <line x1="2" y1="84" x2="465" y2="84" stroke="#EA580C" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>
