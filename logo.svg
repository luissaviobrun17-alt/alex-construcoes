<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- SÍMBOLO ESTRUTURAL (PÓRTICO 'A' + ESCORAS EM 'Y') -->
  <g transform="translate(10, 10)" filter="url(#shadow)">
    <!-- Base estrutural de concreto -->
    <rect x="5" y="92" width="90" height="6" rx="2" fill="#64748B" />
    <rect x="2" y="97" width="96" height="3" rx="1.5" fill="#94A3B8" />

    <!-- Pernas do Pórtico Principal 'A' (Aço Escuro #1E293B) -->
    <!-- Perna esquerda -->
    <polygon points="50,6 40,6 6,92 18,92" fill="url(#steelGrad)" stroke="#334155" stroke-width="0.8" />
    <!-- Perna direita -->
    <polygon points="50,6 60,6 94,92 82,92" fill="url(#steelGrad)" stroke="#334155" stroke-width="0.8" />
    
    <!-- Topo do Pórtico (Capitel de Conexão em Laranja Canteiro) -->
    <polygon points="50,2 62,7 50,14 38,7" fill="url(#orangeGrad)" />

    <!-- Viga Horizontal Superior do 'A' -->
    <rect x="23" y="52" width="54" height="7" rx="1.5" fill="url(#blueGrad)" />

    <!-- ESCORAS FAMILIARES EM 'Y' (Dois perfis simétricos sob a viga do A) -->
    <!-- Escora 'Y' Esquerda -->
    <g stroke="url(#orangeGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- Fuste / pilar vertical inferior -->
      <line x1="33" y1="92" x2="33" y2="76" />
      <!-- Braço esquerdo do Y -->
      <line x1="33" y1="76" x2="25" y2="59" />
      <!-- Braço direito do Y apoiando a viga -->
      <line x1="33" y1="76" x2="41" y2="59" />
    </g>
    <!-- Nó de reforço Y esquerdo -->
    <circle cx="33" cy="76" r="2.5" fill="#1E293B" stroke="#EA580C" stroke-width="1.5" />

    <!-- Escora 'Y' Direita -->
    <g stroke="url(#orangeGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- Fuste / pilar vertical inferior -->
      <line x1="67" y1="92" x2="67" y2="76" />
      <!-- Braço esquerdo do Y apoiando a viga -->
      <line x1="67" y1="76" x2="59" y2="59" />
      <!-- Braço direito do Y -->
      <line x1="67" y1="76" x2="75" y2="59" />
    </g>
    <!-- Nó de reforço Y direito -->
    <circle cx="67" cy="76" r="2.5" fill="#1E293B" stroke="#EA580C" stroke-width="1.5" />

    <!-- Treliça interna superior do 'A' -->
    <line x1="50" y1="14" x2="37" y2="52" stroke="#475569" stroke-width="1.8" />
    <line x1="50" y1="14" x2="63" y2="52" stroke="#475569" stroke-width="1.8" />
  </g>

  <!-- TIPOGRAFIA: ALEX CONSTRUÇÕES & SISTEMA OPERACIONAL -->
  <g transform="translate(122, 22)">
    <!-- ALEX -->
    <text x="0" y="44" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-weight="900" font-size="44" fill="#0F172A" letter-spacing="2">
      ALEX
    </text>
    <!-- CONSTRUÇÕES -->
    <text x="135" y="44" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-weight="800" font-size="44" fill="#EA580C" letter-spacing="1.5">
      CONSTRUÇÕES
    </text>
    <!-- SUBTÍTULO OPERACIONAL -->
    <text x="2" y="68" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-weight="700" font-size="14" fill="#1E3A8A" letter-spacing="3.5">
      SISTEMA OPERACIONAL DE ENGENHARIA &amp; OBRAS
    </text>
    <!-- TAG / LINHA TÉCNICA -->
    <line x1="2" y1="76" x2="350" y2="76" stroke="#EA580C" stroke-width="2.5" stroke-linecap="round" />
  </g>
</svg>
