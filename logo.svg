<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 100" width="100%" height="100%">
  <defs>
    <linearGradient id="beamSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="orangeY" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#C2410C" />
      <stop offset="40%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#FB923C" />
    </linearGradient>
    <linearGradient id="beamBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <filter id="shadowA" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- SÍMBOLO ESTRUTURAL (PÓRTICO 'A' + 2 PILARES 'Y' EM ENGENHARIA) -->
  <g transform="translate(10, 5)" filter="url(#shadowA)">
    <!-- Base de Concreto Armado -->
    <rect x="4" y="82" width="88" height="6" rx="2" fill="#64748B" />
    <rect x="0" y="86" width="96" height="4" rx="1.5" fill="#94A3B8" />

    <!-- Treliça Superior do 'A' -->
    <line x1="48" y1="16" x2="32" y2="44" stroke="#64748B" stroke-width="1.8" stroke-linecap="round" />
    <line x1="48" y1="16" x2="64" y2="44" stroke="#64748B" stroke-width="1.8" stroke-linecap="round" />

    <!-- Pernas do Pórtico Principal 'A' -->
    <polygon points="48,8 38,8 6,82 18,82" fill="url(#beamSteel)" stroke="#94A3B8" stroke-width="1.2" />
    <polygon points="48,8 58,8 90,82 78,82" fill="url(#beamSteel)" stroke="#94A3B8" stroke-width="1.2" />

    <!-- Topo do Pórtico -->
    <polygon points="48,2 59,8 48,14 37,8" fill="url(#orangeY)" stroke="#FDBA74" stroke-width="0.8" />

    <!-- Viga Mestra Transversal do 'A' -->
    <rect x="17" y="44" width="62" height="7.5" rx="1.5" fill="url(#beamBlue)" stroke="#93C5FD" stroke-width="1" />
    <circle cx="21" cy="47.75" r="1.2" fill="#FFFFFF" opacity="0.9" />
    <circle cx="75" cy="47.75" r="1.2" fill="#FFFFFF" opacity="0.9" />

    <!-- ================================================================= -->
    <!-- PILAR 'Y' ESQUERDO (Perfeito perfil estrutural em Y)               -->
    <!-- ================================================================= -->
    <g id="pilar-y-esq">
      <!-- Sapata de base metálica -->
      <rect x="26" y="80" width="14" height="2.5" rx="0.5" fill="#1E293B" stroke="#94A3B8" stroke-width="0.5" />
      
      <!-- Fuste / Tronco Vertical Reto do Y (de y=80 subindo até y=63) -->
      <rect x="30.5" y="63" width="5" height="17" rx="0.8" fill="url(#orangeY)" stroke="#FDBA74" stroke-width="0.7" />
      
      <!-- Nó / Conexão Central do Y -->
      <circle cx="33" cy="63" r="3" fill="#1E293B" stroke="#EA580C" stroke-width="1.8" />

      <!-- Braço Esquerdo do Y (inclina para apoiar a viga em y=51.5) -->
      <polygon points="31,63 35,63 26,51.5 22,51.5" fill="url(#orangeY)" stroke="#FDBA74" stroke-width="0.7" />
      
      <!-- Braço Direito do Y (inclina para apoiar a viga em y=51.5) -->
      <polygon points="31,63 35,63 44,51.5 40,51.5" fill="url(#orangeY)" stroke="#FDBA74" stroke-width="0.7" />

      <!-- Placas de apoio no topo dos braços do Y -->
      <rect x="21" y="51.5" width="6" height="1.8" rx="0.4" fill="#FED7AA" />
      <rect x="39" y="51.5" width="6" height="1.8" rx="0.4" fill="#FED7AA" />
    </g>

    <!-- ================================================================= -->
    <!-- PILAR 'Y' DIREITO (Simétrico e Idêntico)                           -->
    <!-- ================================================================= -->
    <g id="pilar-y-dir">
      <!-- Sapata de base metálica -->
      <rect x="56" y="80" width="14" height="2.5" rx="0.5" fill="#1E293B" stroke="#94A3B8" stroke-width="0.5" />
      
      <!-- Fuste / Tronco Vertical Reto do Y (de y=80 subindo até y=63) -->
      <rect x="60.5" y="63" width="5" height="17" rx="0.8" fill="url(#orangeY)" stroke="#FDBA74" stroke-width="0.7" />
      
      <!-- Nó / Conexão Central do Y -->
      <circle cx="63" cy="63" r="3" fill="#1E293B" stroke="#EA580C" stroke-width="1.8" />

      <!-- Braço Esquerdo do Y -->
      <polygon points="61,63 65,63 56,51.5 52,51.5" fill="url(#orangeY)" stroke="#FDBA74" stroke-width="0.7" />
      
      <!-- Braço Direito do Y -->
      <polygon points="61,63 65,63 74,51.5 70,51.5" fill="url(#orangeY)" stroke="#FDBA74" stroke-width="0.7" />

      <!-- Placas de apoio no topo dos braços do Y -->
      <rect x="51" y="51.5" width="6" height="1.8" rx="0.4" fill="#FED7AA" />
      <rect x="69" y="51.5" width="6" height="1.8" rx="0.4" fill="#FED7AA" />
    </g>
  </g>

  <!-- TIPOGRAFIA: TOTALMENTE VISÍVEL E ALTO CONTRASTE -->
  <g transform="translate(118, 6)">
    <!-- ALEX (Branco Puro #FFFFFF - Impossível passar despercebido) -->
    <text x="0" y="42" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="42" fill="#FFFFFF" letter-spacing="2">
      ALEX
    </text>
    <!-- CONSTRUÇÕES (Laranja Canteiro Segurança) -->
    <text x="124" y="42" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="42" fill="#EA580C" letter-spacing="1.5">
      CONSTRUÇÕES
    </text>
    <!-- SUBTÍTULO TÉCNICO -->
    <text x="2" y="66" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="12" fill="#38BDF8" letter-spacing="3.2">
      SISTEMA OPERACIONAL DE ENGENHARIA &amp; OBRAS
    </text>
    <!-- LINHA GUIA ESTRUTURAL -->
    <line x1="2" y1="75" x2="480" y2="75" stroke="#EA580C" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>
