<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 115" width="100%" height="100%">
  <defs>
    <linearGradient id="beamSteelPrint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="beamOrangePrint" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>
    <linearGradient id="beamBluePrint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
  </defs>

  <!-- SÍMBOLO ESTRUTURAL -->
  <g transform="translate(12, 6)">
    <rect x="4" y="93" width="94" height="7" rx="2" fill="#64748B" />
    <rect x="0" y="98" width="102" height="4" rx="2" fill="#94A3B8" />

    <line x1="51" y1="18" x2="33" y2="52" stroke="#475569" stroke-width="2" stroke-linecap="round" />
    <line x1="51" y1="18" x2="69" y2="52" stroke="#475569" stroke-width="2" stroke-linecap="round" />

    <!-- Pernas do Pórtico 'A' -->
    <polygon points="51,10 39,10 6,93 20,93" fill="url(#beamSteelPrint)" stroke="#334155" stroke-width="1.3" />
    <polygon points="51,10 63,10 96,93 82,93" fill="url(#beamSteelPrint)" stroke="#334155" stroke-width="1.3" />

    <polygon points="51,2 64,9 51,16 38,9" fill="url(#beamOrangePrint)" stroke="#EA580C" stroke-width="0.8" />

    <!-- Viga Mestra Transversal -->
    <rect x="20" y="52" width="62" height="9" rx="2" fill="url(#beamBluePrint)" />
    <circle cx="24" cy="56.5" r="1.5" fill="#FFFFFF" opacity="0.8" />
    <circle cx="78" cy="56.5" r="1.5" fill="#FFFFFF" opacity="0.8" />

    <!-- PILARES EM 'Y' (Sólidos, Fuste Longo e Braços Superiores) -->
    <!-- Pilar Y Esquerdo -->
    <g>
      <rect x="30" y="90" width="14" height="3" rx="1" fill="#EA580C" />
      <rect x="34.5" y="71" width="5" height="20" rx="1" fill="url(#beamOrangePrint)" />
      <circle cx="37" cy="71" r="3.5" fill="#1E293B" stroke="#EA580C" stroke-width="2" />
      <polygon points="35.5,71 38.5,71 29,61 25,61" fill="url(#beamOrangePrint)" />
      <polygon points="35.5,71 38.5,71 49,61 45,61" fill="url(#beamOrangePrint)" />
      <rect x="24" y="60" width="7" height="2" rx="0.5" fill="#FED7AA" />
      <rect x="43" y="60" width="7" height="2" rx="0.5" fill="#FED7AA" />
    </g>

    <!-- Pilar Y Direito -->
    <g>
      <rect x="58" y="90" width="14" height="3" rx="1" fill="#EA580C" />
      <rect x="62.5" y="71" width="5" height="20" rx="1" fill="url(#beamOrangePrint)" />
      <circle cx="65" cy="71" r="3.5" fill="#1E293B" stroke="#EA580C" stroke-width="2" />
      <polygon points="63.5,71 66.5,71 57,61 53,61" fill="url(#beamOrangePrint)" />
      <polygon points="63.5,71 66.5,71 77,61 73,61" fill="url(#beamOrangePrint)" />
      <rect x="52" y="60" width="7" height="2" rx="0.5" fill="#FED7AA" />
      <rect x="71" y="60" width="7" height="2" rx="0.5" fill="#FED7AA" />
    </g>
  </g>

  <!-- TIPOGRAFIA: ALEX EM AÇO ESCURO PARA FOLHAS BRANCAS -->
  <g transform="translate(132, 12)">
    <text x="0" y="46" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="44" fill="#0F172A" letter-spacing="2">
      ALEX
    </text>
    <text x="130" y="46" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="44" fill="#EA580C" letter-spacing="1.5">
      CONSTRUÇÕES
    </text>
    <text x="2" y="74" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="13.5" fill="#1E3A8A" letter-spacing="3.2">
      SISTEMA OPERACIONAL DE ENGENHARIA &amp; OBRAS
    </text>
    <line x1="2" y1="84" x2="465" y2="84" stroke="#EA580C" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>
